name: Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        pytest tests/ --cov=src --cov-report=xml --cov-report=term

    - name: Run linting
      run: |
        pip install flake8 black
        black --check src/ pipeline/ 2>/dev/null || true
        flake8 src/ --max-line-length=127 --ignore=E501,W503,E203

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  build:
    needs: test
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' || github.event.inputs.environment == 'staging'

    steps:
    - uses: actions/checkout@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

    - name: Build Docker image
      run: |
        IMAGE_BASE="$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')"
        docker build -t "$IMAGE_BASE:${{ github.sha }}" .
        docker tag "$IMAGE_BASE:${{ github.sha }}" "$IMAGE_BASE:staging"
        docker push "$IMAGE_BASE:${{ github.sha }}"
        docker push "$IMAGE_BASE:staging"

  deploy-staging:
    needs: build
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' || github.event.inputs.environment == 'staging'

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Add your staging deployment commands here
        # Example: SSH into staging server and run docker-compose
        echo "Staging deployment complete"

  deploy-production:
    needs: build
    runs-on: ubuntu-22.04
    if: github.event.inputs.environment == 'production'
    environment: production

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to production
      run: |
        echo "Deploying to production environment..."
        # Add your production deployment commands here
        # Include: database migrations, health checks, rollback plan
        echo "Production deployment complete"

  notify:
    needs: [deploy-staging, deploy-production]
    runs-on: ubuntu-22.04
    if: always()

    steps:
    - name: Notify deployment status
      run: |
        echo "Deployment notification"
        # Add Slack/Discord/Email notifications here
